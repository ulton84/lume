<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lume</title>
<meta name="theme-color" content="#1E2A78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lume"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<script>
  // tema salvo no aparelho (modo claro/escuro + paleta) antes de desenhar, sem piscar
  try { var m = localStorage.getItem('lume-modo'), p = localStorage.getItem('lume-paleta'), r = document.documentElement;
    if (m === 'claro' || m === 'escuro') r.setAttribute('data-modo', m);
    if (/^(oceano|floresta|aurora|lavanda)$/.test(p || '')) r.setAttribute('data-paleta', p); } catch (e) {}
</script>
<style>
  /* =====================  tokens (mesmos do Lume)  ===================== */
  :root {
    --brand: #1E2A78; --accent: #F5A623; --a3: #7b5cff; --brand-txt: var(--brand);
    --bg: #eef0f7; --card: #ffffff; --ink: #1d2433; --muted: #5f6b7d; --line: #d9dded; --glow: .35; --vidro: rgba(255,255,255,.74);
    --good: #0b8a3e; --warning: #b26a00; --critical: #c62828;
    --logo-azul: #1E2A78; --logo-laranja: #F5A623;
    --f-disp: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
    --topo: 64px;
  }
  html[data-paleta="oceano"]   { --brand: #0b6fa8; --accent: #18c6b0; --a3: #3d5afe; }
  html[data-paleta="floresta"] { --brand: #1d7a45; --accent: #b8cf2a; --a3: #0f9d8a; }
  html[data-paleta="aurora"]   { --brand: #b0186f; --accent: #ff8a3d; --a3: #8e44ff; }
  html[data-paleta="lavanda"]  { --brand: #5b3fd0; --accent: #ff6fae; --a3: #39b6ff; }
  @media (prefers-color-scheme: dark) { html:not([data-modo="claro"]) {
    --bg: #0b0e1c; --card: #141a33; --ink: #eef0ff; --muted: #a1a9cc; --line: #283058; --glow: .7; --vidro: rgba(20,26,51,.74);
    --brand-txt: color-mix(in srgb, var(--brand) 45%, #ffffff); --good: #4cd17f; --warning: #ffb547; --critical: #ff6b6b; color-scheme: dark; } }
  html[data-modo="escuro"] {
    --bg: #0b0e1c; --card: #141a33; --ink: #eef0ff; --muted: #a1a9cc; --line: #283058; --glow: .7; --vidro: rgba(20,26,51,.74);
    --brand-txt: color-mix(in srgb, var(--brand) 45%, #ffffff); --good: #4cd17f; --warning: #ffb547; --critical: #ff6b6b; color-scheme: dark; }

  /* =====================  base  ===================== */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 16px/1.5 var(--f-body); color: var(--ink); min-height: 100vh;
    background: radial-gradient(90% 60% at 100% 0%, color-mix(in srgb, var(--a3) 14%, transparent), transparent 60%),
      radial-gradient(80% 50% at 0% 100%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%), var(--bg); background-attachment: fixed; }
  h1, h2, h3 { font-family: var(--f-disp); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .wrap > section, .area-res, .sec-avs, .card, .form { min-width: 0; }
  .wrap > section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .desc-li p, .grupo p, .grupo li, .ajuda { overflow-wrap: anywhere; }
  .ajuda { color: var(--muted); font-size: 14px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: 0 6px 20px color-mix(in srgb, var(--brand) 8%, transparent); }
  .card h2 { font-size: 20px; margin-bottom: 6px; }

  /* topo */
  header.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
    color: #fff; background: linear-gradient(120deg, var(--brand), color-mix(in srgb, var(--brand) 70%, var(--a3))); box-shadow: 0 6px 20px color-mix(in srgb, var(--brand) 30%, transparent); }
  header.top h1 { flex: 1; min-width: 0; font-size: 20px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-topo { flex: none; height: 40px; min-width: 40px; padding: 0 12px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,.5); background: rgba(255,255,255,.08);
    color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 700; font-size: 14px; }
  .btn-topo:hover { background: rgba(255,255,255,.18); }
  .btn-topo svg { width: 20px; height: 20px; }
  .escola-mini { width: 32px; height: 32px; border-radius: 9px; object-fit: cover; background: #fff; flex: none; }
  body[data-tela="tela-entrar"] header.top, body[data-tela="tela-carregando"] header.top { display: none; }

  /* botões e campos */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 14px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--ink); font-weight: 700; cursor: pointer; transition: transform .15s, box-shadow .2s, border-color .2s; }
  .btn:hover { border-color: var(--brand-txt); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-pri { border-color: transparent; color: #fff; background: linear-gradient(110deg, var(--brand), color-mix(in srgb, var(--brand) 60%, var(--a3)));
    box-shadow: 0 8px 22px color-mix(in srgb, var(--brand) calc(var(--glow) * 80%), transparent); }
  .btn-perigo { border-color: transparent; color: #fff; background: var(--critical); }
  .btn-link { background: none; border: 0; padding: 4px; color: var(--brand-txt); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .btn-peq { padding: 7px 11px; font-size: 14px; border-radius: 11px; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--brand-txt) 60%, transparent); outline-offset: 2px; }
  .campo { display: grid; gap: 5px; }
  .campo label { font-size: 13px; font-weight: 700; color: var(--muted); }
  .campo input, .campo select, .campo textarea { width: 100%; padding: 12px 14px; border-radius: 13px; border: 1.5px solid var(--line); background: var(--bg); outline: none; }
  .campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--brand-txt); background: var(--card); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 18%, transparent); }
  .linha { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .linha > .campo { flex: 1 1 140px; }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .erro { color: var(--critical); font-weight: 600; font-size: 14px; margin: 0; }
  .form { display: grid; gap: 12px; }

  /* =====================  entrada  ===================== */
  .entrada { display: grid; gap: 16px; justify-items: center; text-align: center; padding-top: 24px; }
  .lg-logo { position: relative; width: 108px; height: 108px; border-radius: 30px; display: grid; place-items: center; cursor: pointer;
    background: var(--logo-azul); box-shadow: 0 18px 46px rgba(30,42,120,.42); }
  .lg-logo svg { overflow: visible; }
  .lg-nome { font: 800 clamp(44px, 13vw, 60px)/1 var(--f-disp); letter-spacing: -.04em; color: var(--brand-txt); }
  .lg-frase { margin: -4px 0 0; color: var(--muted); max-width: 38ch; }
  .entrada .card { width: 100%; max-width: 420px; text-align: left; }
  .abas { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--bg); margin-bottom: 14px; }
  .abas button { border: 0; background: none; padding: 9px; border-radius: 11px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .abas button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .demo { width: 100%; max-width: 420px; text-align: left; border: 1.5px dashed color-mix(in srgb, var(--accent) 60%, var(--line)); border-radius: 16px; padding: 12px 14px; font-size: 14px; background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
  .demo b { font-family: var(--f-disp); }
  .demo code { font-size: 13px; }

  /* =====================  início  ===================== */
  .ola { display: grid; gap: 4px; }
  .ola h2 { font-size: 26px; font-weight: 800; }
  .ola .papel { color: var(--muted); font-weight: 600; }
  .atalhos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .atalho { --cor: var(--brand); position: relative; overflow: hidden; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; text-align: left;
    padding: 18px; border-radius: 22px; border: 1.5px solid color-mix(in srgb, var(--cor) 25%, var(--line)); cursor: pointer; color: var(--ink);
    background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--cor) 14%, transparent), transparent 60%), var(--card);
    box-shadow: 0 6px 20px color-mix(in srgb, var(--cor) 10%, transparent); transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .3s; }
  .atalho:hover { transform: translateY(-3px); box-shadow: 0 16px 34px color-mix(in srgb, var(--cor) calc(var(--glow) * 80%), transparent); }
  .atalho .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-size: 24px;
    background: linear-gradient(140deg, var(--cor), color-mix(in srgb, var(--cor) 55%, var(--a3))); box-shadow: 0 8px 18px color-mix(in srgb, var(--cor) 35%, transparent); }
  .atalho h3 { font-size: 19px; }
  .atalho p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .atalho .selo { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--cor); }
  .atalho.c-mon { --cor: var(--brand-txt); } .atalho.c-apoio { --cor: var(--a3); } .atalho.c-flu { --cor: var(--accent); }
  .atalho.c-adm { --cor: color-mix(in srgb, var(--a3) 45%, var(--brand-txt)); } .atalho.c-sup { --cor: color-mix(in srgb, var(--accent) 50%, var(--a3)); }

  /* =====================  turmas (cards por ano, cores da paleta)  ===================== */
  .turmas-lista { display: grid; gap: 18px; }
  [data-ano="1"] { --cor: var(--accent); }
  [data-ano="2"] { --cor: color-mix(in srgb, var(--accent) 50%, var(--a3)); }
  [data-ano="3"] { --cor: var(--a3); }
  [data-ano="4"] { --cor: color-mix(in srgb, var(--a3) 45%, var(--brand-txt)); }
  [data-ano="5"] { --cor: var(--brand-txt); }
  [data-ano="6"] { --cor: color-mix(in srgb, var(--brand-txt) 50%, var(--accent)); }
  [data-ano="7"] { --cor: color-mix(in srgb, var(--accent) 70%, var(--brand-txt)); }
  [data-ano="8"] { --cor: color-mix(in srgb, var(--a3) 70%, var(--accent)); }
  [data-ano="9"] { --cor: color-mix(in srgb, var(--brand-txt) 70%, var(--a3)); }
  [data-ano="m1"] { --cor: color-mix(in srgb, var(--accent) 60%, var(--brand-txt)); }
  [data-ano="m2"] { --cor: color-mix(in srgb, var(--a3) 60%, var(--accent)); }
  [data-ano="m3"] { --cor: color-mix(in srgb, var(--brand-txt) 60%, var(--a3)); }
  [data-ano="m4"] { --cor: color-mix(in srgb, var(--accent) 40%, var(--a3)); }
  .bloco-ano { display: grid; gap: 10px; }
  .bloco-ano-tit { display: flex; align-items: center; gap: 10px; }
  .bloco-ano-selo { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: #fff; font: 800 15px var(--f-disp);
    background: linear-gradient(135deg, var(--cor), color-mix(in srgb, var(--cor) 60%, var(--a3))); box-shadow: 0 6px 16px color-mix(in srgb, var(--cor) 35%, transparent); }
  .bloco-ano-tit h3 { font-size: 19px; }
  .bloco-ano-tit small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
  .bloco-ano-linha { flex: 1; height: 2px; border-radius: 2px; background: linear-gradient(90deg, color-mix(in srgb, var(--cor) 55%, transparent), transparent); }
  .bloco-ano-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tc { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 11px; text-align: left; color: var(--ink); cursor: pointer;
    padding: 12px; border-radius: 20px; border: 1.5px solid color-mix(in srgb, var(--cor) 28%, var(--line));
    background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--cor) 16%, transparent), transparent 60%), var(--card);
    box-shadow: 0 4px 14px color-mix(in srgb, var(--cor) 10%, transparent); transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .3s, border-color .3s; }
  .tc-letra { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; color: #fff; font: 800 24px/1 var(--f-disp);
    background: linear-gradient(140deg, var(--cor), color-mix(in srgb, var(--cor) 55%, var(--a3))); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 14px color-mix(in srgb, var(--cor) 38%, transparent); }
  .tc-letra.longa { font-size: 17px; }
  .tc-tx { min-width: 0; display: grid; gap: 1px; }
  .tc-tx b { font: 800 18px/1.1 var(--f-disp); }
  .tc-tx small { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-ano { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: color-mix(in srgb, var(--cor) 80%, var(--ink)); }
  .tc::after { content: "→"; position: absolute; right: 10px; top: 10px; font-size: 13px; color: var(--cor); opacity: .8; }
  .tc:hover, .tc:focus-visible { transform: translateY(-3px); border-color: var(--cor); box-shadow: 0 14px 30px color-mix(in srgb, var(--cor) calc(var(--glow) * 90%), transparent); }

  /* listas */
  .lista { list-style: none; margin: 0; padding: 0; display: grid; }
  .lista li { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .lista li:last-child { border-bottom: 0; }
  .lista .n { width: 30px; flex: none; font: 800 15px var(--f-disp); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .lista .nome { flex: 1; min-width: 0; }
  .lista .nome small { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .lista .inativo { opacity: .5; text-decoration: line-through; }
  .etq { display: inline-block; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--brand) 12%, transparent); color: var(--brand-txt); }
  .etq.gestor { background: color-mix(in srgb, var(--accent) 22%, transparent); color: color-mix(in srgb, var(--accent) 55%, var(--ink)); }
  .etq.off { background: color-mix(in srgb, var(--critical) 14%, transparent); color: var(--critical); }
  .vazio { color: var(--muted); text-align: center; padding: 18px; }

  /* abas da administração */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); scrollbar-width: none; position: sticky; top: var(--topo); z-index: 5; }
  .chips button { flex: none; border: 0; background: none; padding: 8px 14px; border-radius: 999px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .chips button[aria-selected="true"] { color: #fff; background: linear-gradient(100deg, var(--brand), color-mix(in srgb, var(--brand) 55%, var(--a3))); }
  .marcas { display: flex; flex-wrap: wrap; gap: 6px; }
  .marcas label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; padding: 6px 10px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 14px; font-weight: 600; cursor: pointer; }
  .marcas input { accent-color: var(--brand); }
  .logo-prev { width: 84px; height: 84px; border-radius: 20px; object-fit: cover; border: 1px solid var(--line); background: var(--bg); }

  /* modal e aviso */
  .modal-fundo { position: fixed; inset: 0; z-index: 50; background: rgba(5,8,20,.55); display: grid; place-items: end center; padding: 16px; }
  @media (min-width: 640px) { .modal-fundo { place-items: center; } }
  .modal { width: 100%; max-width: 460px; max-height: 88vh; overflow: auto; background: var(--card); color: var(--ink); border-radius: 24px; padding: 20px; display: grid; gap: 12px; box-shadow: 0 30px 70px rgba(0,0,0,.35); }
  .modal h2 { font-size: 22px; }
  .aviso { position: fixed; z-index: 60; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100vw - 32px);
    padding: 12px 18px; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 600; box-shadow: 0 12px 30px rgba(0,0,0,.3); }
  .aviso.err { background: var(--critical); color: #fff; }

  /* painel de temas */
  .painel-tema { position: fixed; z-index: 40; right: 14px; top: calc(70px + env(safe-area-inset-top)); width: min(340px, calc(100vw - 28px)); background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 18px; display: grid; gap: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.28); }
  .painel-tema .rot { font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .modos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--bg); padding: 4px; border-radius: 12px; }
  .modos button { border: 0; background: none; padding: 8px 4px; border-radius: 9px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .modos button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .paletas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .sw-tema { border: 2px solid var(--line); border-radius: 12px; padding: 6px 2px; background: var(--bg); cursor: pointer; display: grid; gap: 4px; justify-items: center; font-size: 11px; font-weight: 700; color: var(--muted); }
  .sw-tema i { width: 26px; height: 26px; border-radius: 50%; }
  .sw-tema[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
  .tema-flutua { position: fixed; z-index: 30; top: calc(12px + env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); width: 42px; height: 42px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); display: none; place-items: center; cursor: pointer; }
  .tema-flutua svg { width: 20px; height: 20px; }
  body[data-tela="tela-entrar"] .tema-flutua { display: grid; }

  @media (max-width: 480px) { .btn-topo .rot-voltar { display: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* logo: o L fica parado; a bolinha cai ao abrir e depois acende um feixe de luz (lume) que varre o L
     de cima para baixo e revela a palavra EDUCATION escrita ao longo da letra (ciclo de 6 s) */
  .lg-logo svg { width: 74px; height: 74px; }
  .l-ponto { transform-box: fill-box; transform-origin: 50% 50%; animation: v26-cai 1.1s linear .2s both, v61-acende 6s ease-in-out 1.3s infinite; }
  @keyframes v26-cai {
    0%   { transform: translateY(-14px) scale(.9, 1.1); animation-timing-function: cubic-bezier(.5,0,1,.6); }
    40%  { transform: translateY(0) scale(1.25, .75); animation-timing-function: cubic-bezier(0,.4,.5,1); }
    58%  { transform: translateY(-5px) scale(.92, 1.08); animation-timing-function: cubic-bezier(.5,0,1,.6); }
    74%  { transform: translateY(0) scale(1.12, .88); animation-timing-function: cubic-bezier(0,.4,.5,1); }
    86%  { transform: translateY(-1.4px) scale(1); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes v61-acende { 0%, 100% { transform: none; filter: none; } 4%, 30% { transform: scale(1.12); filter: drop-shadow(0 0 1.2px #FFD27A); } 40% { transform: none; filter: none; } }
  .l-feixe { transform-box: view-box; transform-origin: 16.2px 8.4px; transform: rotate(202deg); opacity: 0; filter: drop-shadow(0 0 .8px #FFD27A);
    animation: v61-feixe 6s linear 1.3s infinite; }
  @keyframes v61-feixe {
    0% { transform: rotate(202deg); opacity: 0; }
    4% { transform: rotate(188.3deg); opacity: 1; }
    33.3% { transform: rotate(88deg); opacity: 1; }
    40%, 100% { transform: rotate(84deg); opacity: 0; }
  }

  // Logo da escola: reduz para 256 px no aparelho antes de guardar
  function reduzirImagem(arquivo) {
    return new Promise(function (ok, erro) {
      if (!/^image\//.test(arquivo.type)) { erro(new Error('Escolha uma imagem (PNG ou JPG).')); return; }
      var r = new FileReader();
      r.onload = function () {
        var img = new Image();
        img.onload = function () {
          var lado = 256, cv = document.createElement('canvas'); cv.width = lado; cv.height = lado;
          var cx = cv.getContext('2d'), s = Math.min(img.width, img.height);
          cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, lado, lado);
          cx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, lado, lado);
          ok(cv.toDataURL('image/jpeg', .85));
        };
        img.onerror = function () { erro(new Error('Não consegui abrir esta imagem.')); };
        img.src = r.result;
      };
      r.readAsDataURL(arquivo);
    });
  }

    return w;
  }
  function seletorPapel(v) { var s = el('select'); [['professor', 'Professor(a)'], ['gestor', 'Gestão (vê tudo e administra)']].forEach(function (p) { var o = el('option', null, p[1]); o.value = p[0]; s.appendChild(o); }); s.value = v || 'professor'; return s; }
  function admPessoas(box) {
    var e = estado.perfil.escola;
    Promise.all([carregarTurmas(), D.perfis.listar(e.id), D.convites.listar(e.id), D.professorTurmas.listar(e.id)]).then(function (r) {
      var ts = r[0], perfis = r[1], convites = r[2], pt = r[3];
      // convidar
      var f = el('form', 'card form'); f.noValidate = true;
      f.appendChild(el('h2', null, 'Convidar pessoa'));
      f.appendChild(el('p', 'ajuda', 'Cadastre o e-mail. Depois a pessoa abre o Lume, toca em "Criar conta" e usa esse mesmo e-mail: o acesso já vem com o papel e as turmas que você marcar.'));
      var email = input('email'), nome = input('text'), papel = seletorPapel('professor'), marcas = marcasTurmas(ts, []);
      var l = el('div', 'linha'); l.appendChild(campo('E-mail', email)); l.appendChild(campo('Nome', nome)); f.appendChild(l);
      f.appendChild(campo('Papel', papel));
      var ct = el('div', 'campo'); ct.appendChild(el('label', null, 'Turmas (para professores)')); ct.appendChild(ts.length ? marcas : el('p', 'ajuda', 'Cadastre as turmas primeiro.')); f.appendChild(ct);
      var b = el('button', 'btn btn-pri', 'Criar convite'); b.type = 'submit'; f.appendChild(b);
      f.onsubmit = function (ev) {
        ev.preventDefault();
        if (!/^\S+@\S+\.\S+$/.test(email.value.trim())) { aviso('Digite um e-mail válido.', 'err'); return; }
        b.disabled = true;
        D.convites.criar({ escola_id: e.id, email: email.value, nome: nome.value.trim(), papel: papel.value, turmas: papel.value === 'gestor' ? [] : marcas.valores() })
          .then(function () { aviso('Convite criado. Avise a pessoa para criar a conta com ' + email.value.trim() + '.'); abrirAdmin('pessoas'); })
          .catch(falhou).then(function () { b.disabled = false; });
      };
      box.appendChild(f);
      // convites abertos
      if (convites.length) {
        var cc = el('div', 'card'); cc.appendChild(el('h2', null, 'Convites esperando a pessoa criar a conta'));
        var ulc = el('ul', 'lista');
        convites.forEach(function (c) {
          var li = el('li'); var nm = el('span', 'nome', c.nome || c.email); nm.appendChild(el('small', null, c.email + ' · ' + (c.papel === 'gestor' ? 'Gestão' : 'Professor(a)'))); li.appendChild(nm);
          var x = el('button', 'btn btn-peq', 'Cancelar'); x.type = 'button';
          x.onclick = function () { D.convites.apagar(c.id).then(function () { aviso('Convite cancelado.'); abrirAdmin('pessoas'); }).catch(falhou); };
          li.appendChild(x); ulc.appendChild(li);
        });
        cc.appendChild(ulc); box.appendChild(cc);
      }
      // quem já entra
      var cp = el('div', 'card'); cp.appendChild(el('h2', null, 'Quem já usa o Lume nesta escola'));
      var ulp = el('ul', 'lista');
      perfis.forEach(function (p) {
        var suas = pt.filter(function (x) { return x.perfil_id === p.id; }).map(function (x) { return x.turma_id; });
        var nomesT = ts.filter(function (t) { return suas.indexOf(t.id) !== -1; }).map(nomeTurma);
        var li = el('li'); var nm = el('span', 'nome' + (p.ativo ? '' : ' inativo'), p.nome || p.email);
        nm.appendChild(el('small', null, p.email + (p.papel === 'professor' ? ' · ' + (nomesT.length ? nomesT.join(', ') : 'sem turmas') : '')));
        li.appendChild(nm);
        li.appendChild(el('span', 'etq' + (p.papel === 'gestor' ? ' gestor' : ''), p.papel === 'gestor' ? 'Gestão' : 'Professor'));
        if (!p.ativo) li.appendChild(el('span', 'etq off', 'Bloqueado'));
        var ed = el('button', 'btn btn-peq', 'Editar'); ed.type = 'button'; ed.onclick = function () { editarPessoa(p, ts, suas); };
        li.appendChild(ed); ulp.appendChild(li);
      });
      cp.appendChild(ulp); box.appendChild(cp);
    }).catch(falhou);
  }
  function editarPessoa(p, ts, suas) {
    var eu = p.id === estado.perfil.id;
    var corpo = el('div', 'form'), nome = input('text', p.nome), papel = seletorPapel(p.papel), marcas = marcasTurmas(ts, suas);
    var ativo = el('label'); ativo.style.display = 'flex'; ativo.style.gap = '8px'; ativo.style.alignItems = 'center';
    var cb = input('checkbox'); cb.checked = p.ativo; ativo.appendChild(cb); ativo.appendChild(document.createTextNode('Pode entrar no Lume'));
    corpo.appendChild(el('p', 'ajuda', p.email));
    corpo.appendChild(campo('Nome', nome));
    if (!eu) { corpo.appendChild(campo('Papel', papel)); corpo.appendChild(ativo); }
    var ct = el('div', 'campo'); ct.appendChild(el('label', null, 'Turmas')); ct.appendChild(marcas); corpo.appendChild(ct);
    var botoes = [['Cancelar', '', fecharModal], ['Salvar', 'btn-pri', function () {
      D.perfis.salvar({ id: p.id, nome: nome.value.trim(), papel: eu ? p.papel : papel.value, ativo: eu ? true : cb.checked })
        .then(function () { return D.perfis.definirTurmas(p.id, p.escola_id, marcas.valores()); })
        .then(function () { fecharModal(); aviso('Acesso salvo.'); if (eu) { estado.perfil.nome = nome.value.trim(); estado.perfil.turmas = marcas.valores(); } abrirAdmin('pessoas'); }).catch(falhou);
    }]];
    if (!eu) botoes.splice(1, 0, ['Remover', 'btn-perigo', function () {
      confirmar('Remover o acesso de ' + (p.nome || p.email) + '?', 'A pessoa não consegue mais entrar nesta escola. Para só pausar, desmarque "Pode entrar no Lume".', 'Remover', function () {
        D.perfis.apagar(p.id).then(function () { aviso('Acesso removido.'); abrirAdmin('pessoas'); }).catch(falhou);
      });
    }]);
    modal(eu ? 'Seu acesso' : 'Editar acesso', corpo, botoes);
  }

  /* ---------- escolas (super admin) ---------- */
  function abrirEscolas() {
    var box = $('tela-escolas'); carregando(box); mostrar('tela-escolas', 'Escolas');
    D.escolas.listar().then(function (es) {
      box.textContent = '';
      var f = el('form', 'card form'); f.noValidate = true; f.appendChild(el('h2', null, 'Nova escola'));
      var nome = input('text'), cid = input('text'), email = input('email');
      f.appendChild(campo('Nome da escola', nome));
      var l = el('div', 'linha'); l.appendChild(campo('Cidade', cid)); l.appendChild(campo('E-mail de quem vai administrar (gestão)', email)); f.appendChild(l);
      var b = el('button', 'btn btn-pri', 'Criar escola e convite'); b.type = 'submit'; f.appendChild(b);
      f.onsubmit = function (ev) {
        ev.preventDefault();
        if (nome.value.trim().length < 3) { aviso('Digite o nome da escola.', 'err'); return; }
        b.disabled = true;
        D.escolas.criar({ nome: nome.value.trim(), cidade: cid.value.trim() }).then(function (x) {
          if (email.value.trim()) return D.convites.criar({ escola_id: x.id, email: email.value, nome: '', papel: 'gestor', turmas: [] });
        }).then(function () { aviso('Escola criada.'); abrirEscolas(); }).catch(falhou).then(function () { b.disabled = false; });
      };
      box.appendChild(f);
      var c = el('div', 'card'); c.appendChild(el('h2', null, es.length + (es.length === 1 ? ' escola' : ' escolas')));
      var ul = el('ul', 'lista');
      es.forEach(function (x) {
        var li = el('li'); var nm = el('span', 'nome', x.nome); nm.appendChild(el('small', null, (x.cidade || '—') + ' · ano letivo ' + x.ano_letivo)); li.appendChild(nm);
        var cv = el('button', 'btn btn-peq', 'Convidar gestão'); cv.type = 'button';
        cv.onclick = function () {
          var i = input('email'); var corpo = el('div', 'form'); corpo.appendChild(campo('E-mail', i));
          modal('Convidar gestão · ' + x.nome, corpo, [['Cancelar', '', fecharModal], ['Criar convite', 'btn-pri', function () {
            D.convites.criar({ escola_id: x.id, email: i.value, nome: '', papel: 'gestor', turmas: [] }).then(function () { fecharModal(); aviso('Convite criado.'); }).catch(falhou);
          }]]);
        };
        li.appendChild(cv); ul.appendChild(li);
      });
      c.appendChild(ul); box.appendChild(c);
    }).catch(falhou);
  }

  /* ---------- início do app ---------- */
  if (/nova-senha/.test(location.hash)) { mostrar('tela-nova-senha', 'Nova senha'); }
  else iniciarSessao();
  D.aoMudarSessao(function (ev) { if (ev === 'PASSWORD_RECOVERY') mostrar('tela-nova-senha', 'Nova senha'); });
})();
</script>
</body>
